[workspace]
resolver = "2"
members = [
    "embedding-common",
    "embedding-processing",
    "embedding-database",
    "embedding-index",
    "embedding-server",
    "embedding-model",
    "reranking-model"
]

[workspace.dependencies]
anyhow = "1.0.97"
clap = { version = "4.5.21", features = ["derive"] }
tracing = "0.1.40"
tracing-subscriber = "0.3.18"
rayon = "1.10.0"
serde = { version = "1.0.197", features = ["derive"] }
uuid = { version = "1.8.0", features = ["v4", "serde"] }
serde_repr = "0.1.18"
rmp-serde = "1.1.2"
serde_json = "1.0.105"
ahash = "0.8.11"
num_cpus = "1.16.0"
async-channel = "2.3.1"
chrono = "0.4.38"
indexmap = "2.6.0"
zmq = "0.10.0"
config = { version = "0.15.7", features = ["toml", "async"], default-features = false }
llama-cpp = { git = "https://gitlab.com/qimiaio/qimia-ai-dev/llama-cpp-rs.git", branch = "llama.cpp_b4820_2025-03-04"}


