[index]
dimensions = 768
scalar_kind = "F16"
connectivity = 16
expansion_add = 200
expansion_search = 32
metric_kind = "Cos"

[splitter]
#max_tokens = 512
max_tokens = 400
#hf_model_id = "sentence-transformers/all-MiniLM-L6-v2"
hf_model_id = "google/embeddinggemma-300m"
#hf_model_id = "intfloat/multilingual-e5-large-instruct"
#hf_model_id = "BAAI/bge-m3"
#patterns = [["\n\n"], ["\n"], [".", "!", "?"]]

[embedding_model]
#path = "sentence-transformers/all-MiniLM-L6-v2"
path = "models/embeddinggemma-300m-sentence-transformers-qat-q4_0.gguf"
#path = "models/multilingual-e5-large-instruct-q4_k_m.gguf"
#path = "models/bge-m3-q4_k_m.gguf"
#n_ctx = 8192
n_ctx = 512
#n_embd = 1024
n_embd = 768

[database]
#rocksdb_dir = "rocksdb_dir"

[storage]
# One directory per workspace under this root.
dir = "storage"
# What the loaded shards' indexes may hold resident together.
memory_budget_mb = 4096
# 0 syncs every write instead of on a timer.
fsync_interval_ms = 1000
snapshot_interval_s = 300
segment_max_mb = 256
compact_ratio = 0.3

[zmq]
host = "127.0.0.1"
frontend_port = 5556
backend_port = 5560
num_workers = 4

[endpoints]
embedding_endpoint = "tcp://localhost:5559"
reranking_endpoint = "tcp://localhost:5557"
