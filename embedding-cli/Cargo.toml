[package]
name = "embedding-cli"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = {workspace = true}
tokio = { workspace = true}
rayon = {workspace = true}
futures = {workspace = true}
async-channel = {workspace = true}
tracing = {workspace = true}
tracing-subscriber = {workspace = true}
uuid = {workspace = true}
clap = { version = "4.5.20", features = ["derive"] }


embedding-common = { path = "../embedding-common" }
embedding-processing = { path = "../embedding-processing" }
embedding-database = { path = "../embedding-database" }
embedding-index = { path = "../embedding-index" }

[dev-dependencies]
tokio = { version = "1.41.0", features = ["test-util"] }
rstest = "0.23.0"
tempfile = "3.10.1"

