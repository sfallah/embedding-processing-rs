[index]
index_dir = "test_index_dir"
dimensions = 384
metric_kind = "Cos"
#scalar_kind = "F16"
#connectivity = 16
#expansion_add = 32
expansion_search = 32

[splitter]
max_tokens = 512
hf_model_id = "sentence-transformers/all-MiniLM-L6-v2"
patterns = [["\n\n"], ["\n"], [".", "!", "?"]]

[model]
gguf_file = "models/all-minilm-l6-v2-q2_k.gguf"
instances = 2
#cpu = true
#ngl = 32

[database]
rocksdb_dir = "test_rocksdb_dir"

[zmq]
zmq_host = "127.0.0.1"
zmq_frontend_port = 5556
zmq_backend_port = 5560
zmq_num_workers = 2

