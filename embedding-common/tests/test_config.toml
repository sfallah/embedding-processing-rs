[index]
index_dir = "test_index_dir"
dimensions = 384
metric_kind = "Cos"
#scalar_kind = "F16"
#connectivity = 16
#expansion_add = 32
expansion_search = 32

[splitter]
max_tokens = 512
hf_model_id = "sentence-transformers/all-MiniLM-L6-v2"
patterns = [["\n\n"], ["\n"], [".", "!", "?"]]

[embedding_model]
path = "models/all-minilm-l6-v2-q2_k.gguf"
n_ctx = 512
n_embd = 384

[database]
rocksdb_dir = "test_rocksdb_dir"

[storage]
dir = "test_storage_dir"
memory_budget_mb = 512
fsync_interval_ms = 250
snapshot_interval_s = 60
segment_max_mb = 8
compact_ratio = 0.5

[zmq]
host = "127.0.0.1"
frontend_port = 5556
backend_port = 5560
num_workers = 2

[endpoints]
embedding_endpoint = "tcp://localhost:5559"
reranking_endpoint = "tcp://localhost:5557"
