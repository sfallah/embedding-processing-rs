[package]
name = "embedding-processing"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

async-channel = {workspace = true}


fast-text-splitter = { git = "https://gitlab.com/qimiaio/qimia-ai-dev/fast-text-splitter.git", branch = "feat/merge_level_async" }
lexrank-ndarray = { git = "https://gitlab.com/qimiaio/qimia-ai-dev/lexrank-ndarray.git", branch = "main" }
llama-cpp-sys = { git = "https://gitlab.com/qimiaio/qimia-ai-dev/llama-cpp-rs.git", package = "llama-cpp-sys", branch = "llama.cpp_b4574_2025-01-28" }
llama-cpp = { git = "https://gitlab.com/qimiaio/qimia-ai-dev/llama-cpp-rs.git", package = "llama-cpp", branch = "llama.cpp_b4574_2025-01-28" }

embedding-common = { path = "../embedding-common" }

[dev-dependencies]
rstest = "0.23.0"
criterion = { version = "0.5.1", features = ["async_tokio"] }
tokio = { version = "1.41.0", features = ["test-util"] }

[[bench]]
name = "benchmarks"
harness = false

[features]
default = []
cuda = [ "llama-cpp/cuda", "llama-cpp-sys/cuda"]
metal = ["llama-cpp/metal", "llama-cpp-sys/metal"]
accelerate = ["lexrank-ndarray/accelerate"]
blas = ["lexrank-ndarray/blas"]
mkl = ["lexrank-ndarray/mkl"]