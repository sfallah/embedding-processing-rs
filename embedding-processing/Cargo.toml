[package]
name = "embedding-processing"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }

ahash = {workspace = true}
chrono = "0.4.38"
zmq = {workspace = true}
async-channel = {workspace = true}


fast-text-splitter = { git = "https://gitlab.com/qimiaio/qimia-ai-dev/fast-text-splitter.git", branch = "feat/merge_level_async_sent" }
# blas_lexrank_array needs a BLAS linked; the per-platform features below pick one, so a plain
# `cargo build` works everywhere. Override with -F mkl (or -F blas for a shared OpenBLAS).
lexrank-ndarray = { git = "https://github.com/sfallah/lexrank-ndarray.git", branch = "main" }
rayon = "1.10.0"

embedding-common = { path = "../embedding-common" }
rand = "0.9.0"

# Apple's Accelerate: part of macOS, nothing to install or ship.
[target.'cfg(target_os = "macos")'.dependencies]
lexrank-ndarray = { git = "https://github.com/sfallah/lexrank-ndarray.git", branch = "main", features = ["accelerate"] }

# OpenBLAS, built from source and linked statically, so the binary carries it and the slim
# runtime image needs nothing added. The builder image needs a C toolchain and make.
[target.'cfg(not(target_os = "macos"))'.dependencies]
lexrank-ndarray = { git = "https://github.com/sfallah/lexrank-ndarray.git", branch = "main", features = ["blas-static"] }

[dev-dependencies]
rstest = {workspace = true}
criterion = {workspace = true}

[[bench]]
name = "benchmarks"
harness = false

[features]
default = []
#cuda = [ "embedding-model/cuda"]
#metal = ["embedding-model/metal"]
accelerate = ["lexrank-ndarray/accelerate"]
blas = ["lexrank-ndarray/blas"]
blas-static = ["lexrank-ndarray/blas-static"]
mkl = ["lexrank-ndarray/mkl"]