[package]
name = "embedding-server"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true}
num_cpus = { workspace = true }
uuid = { workspace = true }
serde = { workspace = true }
serde_repr = { workspace = true }
chrono = { workspace = true }
indexmap = { workspace = true }
zmq = { workspace = true }
# SIGINT, SIGTERM and SIGHUP, so a shutdown snapshots instead of leaving a tail to replay (D6).
ctrlc = { version = "3.5", features = ["termination"] }

embedding-common = { path = "../embedding-common" }
embedding-database = { path = "../embedding-database" }
embedding-index = { path = "../embedding-index" }
embedding-processing = { path = "../embedding-processing" }
embedding-store = { path = "../embedding-store" }

[dev-dependencies]
tempfile = "3.14.0"

[[bin]]
name = "embedding_server"
path = "src/main.rs"

[[bin]]
name = "smoke_client"
path = "src/bin/smoke_client.rs"