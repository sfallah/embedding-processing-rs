[package]
name = "embedding-store"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = { workspace = true }
serde = { workspace = true }
rmp-serde = { workspace = true }
uuid = { workspace = true }
tracing = { workspace = true }
memmap2 = "0.9.5"
indexmap = { workspace = true }
usearch = "2.26.2"
crc32fast = "1.4.2"
half = "2.4.1"
embedding-common = { path = "../embedding-common" }

# Only for the migration tool. This is the last place the rocksdb crate is used.
clap = { workspace = true, optional = true }
rocksdb = { version = "0.24.0", features = ["multi-threaded-cf"], optional = true }

[dev-dependencies]
tempfile = "3.14.0"

[features]
rocksdb-migration = ["dep:clap", "dep:rocksdb"]

[[bin]]
name = "migrate_rocksdb"
path = "src/bin/migrate_rocksdb.rs"
required-features = ["rocksdb-migration"]
