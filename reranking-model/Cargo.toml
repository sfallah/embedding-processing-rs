[package]
name = "reranking-model"
version = "0.1.0"
edition = "2021"

[dependencies]
qllama = { workspace = true }
anyhow = "1.0.95"
clap = { version = "4.5.28", features = ["derive"] }
tracing = "0.1.41"
serde = {workspace = true}
embedding-common = { path = "../embedding-common" }
zmq = {workspace = true}
uuid = {workspace = true}
rmp-serde = { workspace = true }
serde_json = {workspace = true}
#bstr = "1.11.3"
indexmap = { workspace = true }

[dev-dependencies]
criterion = {workspace = true}

[[bench]]
name = "benchmarks"
harness = false


[features]
default = []
cuda = ["qllama/cuda"]
metal = ["qllama/metal"]

[[bin]]
name = "reranking_cli"
path = "src/reranking_cli.rs"

[[bin]]
name = "reranking_broker"
path = "src/reranking_broker.rs"

[[bin]]
name = "reranking_worker"
path = "src/reranking_worker.rs"

[[bin]]
name = "reranking_client"
path = "src/reranking_client.rs"
